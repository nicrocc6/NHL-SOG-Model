name: Nightly model run

on:
  schedule:
    - cron: "0 14 * * *"         # 9:00 AM ET (EST): update data, grade, retrain Mondays, project, opening odds
    - cron: "*/30 16-23 * * *"   # every 30 min, 11 AM - 6:30 PM ET: closing lines for games about to start
    - cron: "*/30 0-3 * * *"     # every 30 min, 7 PM - 10:30 PM ET
  workflow_dispatch:
    inputs:
      mode:
        description: "morning or close"
        default: morning

permissions:
  contents: write

concurrency:
  group: nhl-model
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 14 * * *' && 'morning' || 'close') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run ${{ env.MODE }}
        run: python src/daily.py "$MODE"
      - name: Commit results
        run: |
          git config user.name "nhl-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data results models
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Nightly $MODE run $(TZ=America/Toronto date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          exit 1
